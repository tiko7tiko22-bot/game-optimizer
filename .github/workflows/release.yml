name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Run tests
        run: dotnet test Tests/GameOptimizer.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish (win-x64 single-file)
        run: >
          dotnet publish GameOptimizer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:WindowsPackageType=None
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Copy exe for direct upload
        run: Copy-Item publish/win-x64/GameOptimizer.exe GameOptimizer.exe

      - name: Zip release (full folder fallback)
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath GameOptimizer-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Gaming Optimizer ${{ github.ref_name }}"
          body: |
            ## Gaming Optimizer ${{ github.ref_name }}

            ### Download
            | File | Description |
            |---|---|
            | `GameOptimizer.exe` | Single-file - just download and run |
            | `GameOptimizer-${{ github.ref_name }}-win-x64.zip` | Full build (fallback) |

            **Requirements:** Windows 10 1809 (build 17763) or later, x64

            > **SmartScreen warning:** The binary is not signed with a paid certificate.
            > If Windows shows "Windows protected your PC", click **More info** then **Run anyway**.
            > The build runs directly from source via GitHub Actions - verify the workflow or build from source yourself.

            ### What's new
            See [CHANGELOG.md](https://github.com/maxrenke/game-optimizer/blob/main/CHANGELOG.md) for details.
          files: |
            GameOptimizer.exe
            GameOptimizer-${{ github.ref_name }}-win-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
