name: Build Gaming Optimizer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        shell: powershell
        run: |
          dotnet restore GameOptimizer.csproj

      - name: Run tests
        shell: powershell
        run: |
          dotnet test Tests/GameOptimizer.Tests.csproj `
            -c Release `
            --no-restore

      - name: Publish Gaming Optimizer
        shell: powershell
        run: |
          if (Test-Path "publish") {
            Remove-Item "publish" -Recurse -Force
          }

          dotnet publish GameOptimizer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o publish/win-x64

      - name: Verify published files
        shell: powershell
        run: |
          $publish = "publish/win-x64"
          $exe = Join-Path $publish "GameOptimizer.exe"

          if (!(Test-Path $exe)) {
            Write-Error "GameOptimizer.exe was not created."
            Write-Host ""
            Write-Host "Published files:"
            if (Test-Path $publish) {
              Get-ChildItem $publish -Recurse |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize
            }
            exit 1
          }

          Write-Host "GameOptimizer.exe found successfully."
          Write-Host ""
          Write-Host "Published folder:"
          Get-ChildItem $publish -Recurse |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Create ZIP package
        shell: powershell
        run: |
          $zip = "GameOptimizer-win-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "publish/win-x64/*" `
            -DestinationPath $zip `
            -Force

          Write-Host "Created: $zip"
          Get-Item $zip | Select-Object FullName, Length, LastWriteTime

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GameOptimizer-win-x64
          path: GameOptimizer-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Gaming Optimizer ${{ github.ref_name }}
          generate_release_notes: true
          files: GameOptimizer-win-x64.zip
