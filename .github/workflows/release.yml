name: Build Gaming Optimizer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Run tests
        run: dotnet test Tests/GameOptimizer.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish Gaming Optimizer
        run: >
          dotnet publish GameOptimizer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:WindowsPackageType=None
          -p:IncludeAllContentForSelfExtract=true
          -o publish/win-x64
          - name: Verify EXE exists
        shell: powershell
        run: |
          if (!(Test-Path "publish/win-x64/GameOptimizer.exe")) {
            Write-Error "GameOptimizer.exe was not created."
            exit 1
          }

          Write-Host "GameOptimizer.exe found successfully."
          Get-Item "publish/win-x64/GameOptimizer.exe" |
            Select-Object FullName, Length, LastWriteTime

      - name: Copy EXE
        shell: powershell
        run: |
          Copy-Item `
            "publish/win-x64/GameOptimizer.exe" `
            "GameOptimizer.exe" `
            -Force

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "publish/win-x64/*" `
            -DestinationPath "GameOptimizer-win-x64.zip" `
            -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameOptimizer-win-x64
          path: |
            GameOptimizer.exe
            GameOptimizer-win-x64.zip
          if-no-files-found: error
          retention-days: 7
