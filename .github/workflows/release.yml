name: Build Gaming Optimizer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore GameOptimizer.csproj

      - name: Run tests
        run: dotnet test Tests/GameOptimizer.Tests.csproj -c Release --no-restore

      - name: Publish Gaming Optimizer
        shell: powershell
        run: |
          dotnet publish GameOptimizer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-x64

      - name: Verify EXE exists
        shell: powershell
        run: |
          $exe = "publish/win-x64/GameOptimizer.exe"

          if (!(Test-Path $exe)) {
            Write-Error "GameOptimizer.exe was not created."
            Write-Host "Files produced:"
            Get-ChildItem "publish/win-x64" -Recurse | Select-Object FullName, Length
            exit 1
          }

          Write-Host "GameOptimizer.exe found successfully."
          Get-Item $exe | Select-Object FullName, Length, LastWriteTime

      - name: Copy EXE to root
        shell: powershell
        run: |
          Copy-Item `
            "publish/win-x64/GameOptimizer.exe" `
            "GameOptimizer.exe" `
            -Force

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "publish/win-x64/*" `
            -DestinationPath "GameOptimizer-win-x64.zip" `
            -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameOptimizer-win-x64
          path: |
            GameOptimizer.exe
            GameOptimizer-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Gaming Optimizer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            GameOptimizer.exe
            GameOptimizer-win-x64.zip
